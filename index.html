<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สร้างภาพรายงานผลการปฏิบัติ – สภ.กบินทร์บุรี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f9;--card:#fff;--ink:#0b2a5b;--sub:#53668a;--line:#cdd8ec;--gold:#c9a24a;--navy:#0b2a5b;--navy2:#143f86;--btnink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--card:#111f38;--ink:#e8eefb;--sub:#9fb2d4;--line:#243a63;--navy:#1d4fa8;--navy2:#2a63c9}}
:root[data-theme="dark"]{--bg:#0a1424;--card:#111f38;--ink:#e8eefb;--sub:#9fb2d4;--line:#243a63;--navy:#1d4fa8;--navy2:#2a63c9}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:20px;grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:18px}
h1{font-size:1.2rem;margin:0 0 2px;font-weight:800}
.lead{margin:0 0 14px;color:var(--sub);font-size:.9rem}
label,.lbl{display:block;font-weight:600;font-size:.95rem;margin:14px 0 6px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
textarea{min-height:150px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,.pick:focus-within{outline:3px solid var(--gold);outline-offset:1px}
.pick{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--navy2);border-radius:8px;padding:14px;font-weight:600;cursor:pointer;color:var(--navy2);background:var(--bg)}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.th{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:2px solid var(--gold)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.hint{font-size:.82rem;color:var(--sub);margin:6px 0 0}
.count{float:right;font-weight:400;color:var(--sub);font-size:.82rem}
.row{display:flex;gap:10px;margin-top:18px}
button.main{flex:1;font:inherit;font-weight:800;font-size:1.05rem;color:var(--btnink);background:linear-gradient(180deg,var(--navy2),var(--navy));border:2px solid var(--gold);border-radius:8px;padding:13px;cursor:pointer}
button.ghost{font:inherit;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:13px 16px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.status{min-height:1.4em;margin:10px 0 0;font-size:.9rem}
.status.warn{color:#b45309}.status.ok{color:#15803d}
@media(prefers-color-scheme:dark){.status.warn{color:#fbbf24}.status.ok{color:#4ade80}}
.preview{position:sticky;top:12px}
canvas{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#fff}
.prevhd{display:flex;justify-content:space-between;color:var(--sub);font-size:.85rem;margin:0 0 8px}
</style>
</head>
<body>
<main class="wrap">
  <section class="panel">
    <h1>สร้างภาพรายงานผลการปฏิบัติ</h1>
    <p class="lead">กรอกข้อมูล 3 ส่วน แล้วกดบันทึก ระบบจะวางลงบนพื้นหลังและสร้างเป็นรูปภาพให้</p>

    <label for="title">1. หัวข้อรายงาน (แสดงเหนือรูป)</label>
    <input type="text" id="title" maxlength="120" placeholder="เช่น ตั้งจุดตรวจร่วมหน่วยงาน ต.เมืองเก่า">

    <div class="lbl">2. รูปภาพ <span class="count" id="cnt">0/4</span></div>
    <label class="pick" id="pickLbl"><input type="file" id="file" accept="image/*" multiple>เลือกรูปภาพ (1–4 รูป)</label>
    <div class="thumbs" id="thumbs"></div>
    <p class="hint">ใช้เมาส์ลากบนภาพตัวอย่างเพื่อเลื่อนตำแหน่งรูปในแต่ละช่อง</p>

    <label for="body">3. รายละเอียด (แสดงในกรอบด้านล่าง)</label>
    <textarea id="body" placeholder="พิมพ์รายละเอียดการปฏิบัติ ขึ้นบรรทัดใหม่ได้ ตัวอักษรจะย่อให้พอดีกรอบอัตโนมัติ"></textarea>

    <div class="row">
      <button class="main" id="save">บันทึกเป็นรูปภาพ</button>
      <button class="ghost" id="reset" type="button">ล้างข้อมูล</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>

  <section class="preview">
    <div class="prevhd"><span>ภาพตัวอย่าง</span><span>ขนาดไฟล์ 1055 × 1491 px</span></div>
    <canvas id="cv" width="1055" height="1491" aria-label="ภาพตัวอย่างรายงาน"></canvas>
  </section>
</main>

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const bg=new Image();let bgReady=false;
bg.onload=()=>{bgReady=true;render()};bg.src=BG_SRC;
let photos=[];let overflow=false;

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function wrap(text,maxW){
  const out=[];
  const seg=(typeof Intl!=='undefined'&&Intl.Segmenter)?new Intl.Segmenter('th',{granularity:'word'}):null;
  for(const para of text.split('\n')){
    if(!para.trim()){out.push('');continue}
    const words=seg?[...seg.segment(para)].map(s=>s.segment):para.split(/(?<= )/);
    let cur='';
    for(const w of words){
      if(cur&&ctx.measureText((cur+w).trimEnd()).width>maxW){out.push(cur.trimEnd());cur=w.trimStart()}
      else cur+=w;
    }
    out.push(cur.trimEnd());
  }
  return out;
}
function fit(text,maxW,maxH,max,min,weight,lh){
  for(let s=max;s>=min;s--){
    ctx.font=weight+' '+s+'px '+FONT;
    const lines=wrap(text,maxW);
    if(lines.length*s*lh<=maxH)return{s,lines,ok:true};
  }
  ctx.font=weight+' '+min+'px '+FONT;
  const lines=wrap(text,maxW);
  const maxL=Math.floor(maxH/(min*lh));
  return{s:min,lines:lines.slice(0,maxL),ok:false};
}

function cells(n,x,y,w,h,g){
  if(n===1)return[[x,y,w,h]];
  if(n===2){const cw=(w-g)/2;return[[x,y,cw,h],[x+cw+g,y,cw,h]]}
  if(n===3){const lw=Math.round(w*.58),rw=w-lw-g,rh=(h-g)/2;return[[x,y,lw,h],[x+lw+g,y,rw,rh],[x+lw+g,y+rh+g,rw,rh]]}
  const cw=(w-g)/2,ch=(h-g)/2;
  return[[x,y,cw,ch],[x+cw+g,y,cw,ch],[x,y+ch+g,cw,ch],[x+cw+g,y+ch+g,cw,ch]];
}
let lastCells=[];

function drawPhoto(p,[x,y,w,h]){
  const iw=p.img.naturalWidth,ih=p.img.naturalHeight;
  const sc=Math.max(w/iw,h/ih),dw=iw*sc,dh=ih*sc;
  const mx=(dw-w)/2,my=(dh-h)/2;
  p.ox=clamp(p.ox,-mx,mx);p.oy=clamp(p.oy,-my,my);
  ctx.save();rr(x,y,w,h,14);ctx.clip();
  ctx.drawImage(p.img,x+(w-dw)/2+p.ox,y+(h-dh)/2+p.oy,dw,dh);
  ctx.restore();
  rr(x,y,w,h,14);ctx.lineWidth=4;ctx.strokeStyle='#d6ae4f';ctx.stroke();
  rr(x+3,y+3,w-6,h-6,11);ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.stroke();
}

function render(){
  ctx.clearRect(0,0,W,H);
  if(bgReady)ctx.drawImage(bg,0,0,W,H);
  const title=$('title').value.trim();
  let top=302;
  if(title){
    const bx=40,by=300,bw=975,bh=92;
    const g=ctx.createLinearGradient(0,by,0,by+bh);g.addColorStop(0,'#143f86');g.addColorStop(1,'#07204a');
    rr(bx,by,bw,bh,16);ctx.fillStyle=g;ctx.fill();
    ctx.lineWidth=4;ctx.strokeStyle='#d6ae4f';ctx.stroke();
    const f=fit(title,bw-60,bh-18,50,24,'800',1.28);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    const th=f.lines.length*f.s*1.28,y0=by+bh/2-th/2+f.s*1.28/2;
    f.lines.forEach((l,i)=>{ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=4;ctx.fillText(l,bx+bw/2,y0+i*f.s*1.28)});
    ctx.shadowBlur=0;top=by+bh+14;
  }
  const bottom=888;
  lastCells=[];
  if(photos.length){
    lastCells=cells(photos.length,40,top,975,bottom-top,12);
    photos.forEach((p,i)=>drawPhoto(p,lastCells[i]));
  }
  const body=$('body').value.trim();
  overflow=false;
  if(body){
    const f=fit(body,905,318,46,18,'400',1.45);
    overflow=!f.ok;
    ctx.fillStyle='#0b2a5b';ctx.textAlign='left';ctx.textBaseline='top';
    f.lines.forEach((l,i)=>ctx.fillText(l,75,1008+i*f.s*1.45));
  }
  ctx.textAlign='left';
  if(!$('status').dataset.lock)setStatus(overflow?'ข้อความยาวมาก ตัวอักษรเล็กสุดแล้วยังไม่พอดีกรอบ ลองตัดข้อความให้สั้นลง':'',overflow?'warn':'');
}

function setStatus(t,c){const s=$('status');s.textContent=t;s.className='status '+(c||'')}

function thumbs(){
  const box=$('thumbs');box.innerHTML='';
  photos.forEach((p,i)=>{
    const d=document.createElement('div');d.className='th';
    const im=document.createElement('img');im.src=p.url;im.alt='รูปที่ '+(i+1);
    const b=document.createElement('button');b.type='button';b.textContent='×';b.setAttribute('aria-label','ลบรูปที่ '+(i+1));
    b.onclick=()=>{URL.revokeObjectURL(p.url);photos.splice(i,1);thumbs();render()};
    d.append(im,b);box.append(d);
  });
  $('cnt').textContent=photos.length+'/4';
}

$('file').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';
  let skipped=0;
  for(const f of files){
    if(photos.length>=4){skipped++;continue}
    const url=URL.createObjectURL(f);
    const img=new Image();
    try{await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url})}catch(_){URL.revokeObjectURL(url);continue}
    photos.push({img,url,ox:0,oy:0});
  }
  delete $('status').dataset.lock;
  thumbs();render();
  if(skipped)setStatus('รับได้สูงสุด 4 รูป ระบบข้ามรูปที่เกิน','warn');
});
$('title').addEventListener('input',()=>{delete $('status').dataset.lock;render()});
$('body').addEventListener('input',()=>{delete $('status').dataset.lock;render()});

$('reset').onclick=()=>{
  photos.forEach(p=>URL.revokeObjectURL(p.url));photos=[];
  $('title').value='';$('body').value='';delete $('status').dataset.lock;
  thumbs();render();setStatus('');
};

/* drag to pan (mouse / pen) */
let drag=null;
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'||!photos.length)return;
  const[x,y]=pos(e);
  const i=lastCells.findIndex(([cx,cy,cw,ch])=>x>=cx&&x<=cx+cw&&y>=cy&&y<=cy+ch);
  if(i<0)return;
  drag={i,x,y};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  const[x,y]=pos(e);
  photos[drag.i].ox+=x-drag.x;photos[drag.i].oy+=y-drag.y;
  drag.x=x;drag.y=y;render();
});
const endDrag=()=>{drag=null;cv.style.cursor=''};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

/* save */
$('save').onclick=async()=>{
  if(!photos.length&&!$('title').value.trim()&&!$('body').value.trim()){setStatus('กรอกหัวข้อ เลือกรูป หรือพิมพ์รายละเอียดอย่างน้อย 1 อย่างก่อนบันทึก','warn');return}
  const btn=$('save');btn.disabled=true;
  try{
    await document.fonts.ready;render();
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    const d=new Date(),p=n=>String(n).padStart(2,'0');
    const name='รายงาน-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.png';
    let dl=null;
    try{dl=window.claude&&await claude.use('downloads')}catch(_){}
    if(dl){await dl.save({filename:name,data:blob})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove()}
    $('status').dataset.lock='1';setStatus('บันทึกรูปภาพแล้ว: '+name,'ok');
  }catch(err){
    if(err&&err.code==='declined'){setStatus('ยกเลิกการบันทึก','warn')}
    else{setStatus('บันทึกไม่สำเร็จ ลองกดอีกครั้ง','warn')}
  }finally{btn.disabled=false}
};

document.fonts.load('800 40px "Noto Sans Thai"');document.fonts.load('400 40px "Noto Sans Thai"');
document.fonts.ready.then(render);
render();
</script>
